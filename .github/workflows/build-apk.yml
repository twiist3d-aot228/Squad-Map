name: Build Squad Map APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android platform 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore the debug signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: squad-map-debug-keystore-v1

      - name: Create the debug signing key on first run
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Squad Map - latest APK
          body: |
            Install: download app-debug.apk below, open it on your Android phone, and allow installs from your browser or files app when asked.
            This build is signed with a shared debug key, so future updates install right over the old version.
          files: app/build/outputs/apk/debug/app-debug.apk
